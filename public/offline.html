<!DOCTYPE html>
<html lang="hi" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ऑफ़लाइन मोड | हिंदी हेल्थ गाइड</title>
  <meta name="theme-color" content="#0f766e">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fafaf9;
      color: #1c1917;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .icon {
      width: 4rem;
      height: 4rem;
      background: #fef3c7;
      color: #d97706;
      border-radius: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1c1917;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.925rem;
      color: #57534e;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background: #0f766e;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #115e59; }
    .helpline {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #f5f5f4;
      font-size: 0.8rem;
      color: #78716c;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>आप ऑफ़लाइन हैं (You are Offline)</h1>
    <p>ऐसा प्रतीत होता है कि आपका इंटरनेट कनेक्शन टूट गया है। आप पहले से लोड किए गए स्वास्थ्य लेख पढ़ सकते हैं।</p>
    <a href="/" class="btn" onclick="window.location.reload();">पुनः प्रयास करें / मुख्य पृष्ठ</a>
    <div class="helpline">
      आपातकालीन स्वास्थ्य सहायता: <strong>1075</strong> (राष्ट्रीय स्वास्थ्य हेल्पलाइन)
    </div>
  </div>
</body>
</html>
